  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

.436, pos: [1.4, 2.7, -6.6], tgt: [5, 0.45, 0], fov: 42 },\n  { p: 0.470, pos: [7.7, 1.25, -3.4], tgt: [6.35, 0.5, 0], fov: 38 },\n  { p: 0.520, pos: [7.05, 1.05, -4.6], tgt: [6.35, 0.55, 0], fov: 33 },\n  { p: 0.560, pos: [7.02, 1.02, -4.4], tgt: [6.38, 0.55, 0], fov: 33 },\n  { p: 0.600, pos: [7.4, 2.3, 3.0], tgt: [6.0, 0.5, 0], fov: 40 },\n  { p: 0.668, pos: [5.0, 1.9, 5.4], tgt: [5, 0.5, 0], fov: 42 },\n  { p: 0.712, pos: [5.15, 0.92, 4.8], tgt: [5.05, 0.46, 0], fov: 46 },\n  { p: 0.760, pos: [4.4, 0.95, 3.9], tgt: [5, 0.48, 0], fov: 44 },\n  { p: 0.830, pos: [5.0, 1.5, 5.6], tgt: [5, 0.6, 0], fov: 42 },\n  { p: 1.000, pos: [5.0, 2.0, 7.6], tgt: [5, 0.75, 0], fov: 40 }\n];\n\nconst IMPACT = 0.712;\nconst clamp = (v, a, b) => (v < a ? a : v > b ? b : v);\nconst inv = (v, a, b) => clamp((v - a) / (b - a || 1), 0, 1);\nconst ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);\nconst smooth = t => t * t * (3 - 2 * t);\nconst lerp = (a, b, t) => a + (b - a) * t;\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.rootRef = React.createRef();\n    this.canvasRef = React.createRef();\n    this.state = { logo: props.logoStyle || 'A3' };\n    this.p = 0; this.pSmooth = 0; this.pv = 0;\n    this.mx = 0; this.my = 0; this.mxs = 0; this.mys = 0;\n  }\n\n  renderVals() {\n    const setLogo = v => { this.setState({ logo: v }); this.applyLogo(v); this.t0 = null; };\n    return {\n      rootRef: this.rootRef, canvasRef: this.canvasRef,\n      pickOpacity: this.state.picker ? 1 : 0,\n      pickEvents: this.state.picker ? 'auto' : 'none',\n      pickA: () => setLogo('A'), pickB: () => setLogo('B'), pickC: () => setLogo('C'),\n      pickD: () => setLogo('D'), pickE: () => setLogo('E'), pickF: () => setLogo('F'),\n      pickA2: () => setLogo('A2'), pickA3: () => setLogo('A3'), pickA4: () => setLogo('A4')\n    };\n  }\n\n  componentDidMount() {\n    const root = this.rootRef.current;\n    this.q = s => root.querySelector(s);\n    this.vlen = 8200 * (this.props.pace ?? 1);\n    this.applySlots();\n    this.applyLogo(this.state.logo);\n    this.collect();\n\n    this.advance = d => {\n      this.pv = clamp(this.pv + d / this.vlen, 0, 1);\n      const t = performance.now() / 1000;\n      if (this.renderer && t - (this.last || 0) > 0.35) { this.last = t; this.frame(t, 0.016, true); }\n    };\n    this.onWheel = e => { e.preventDefault(); this.advance((e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.85); };\n    this.onTouchStart = e => { this.ty = e.touches[0].clientY; };\n    this.onTouchMove = e => { const y = e.touches[0].clientY; this.advance((this.ty - y) * 2.6); this.ty = y; if (e.cancelable) e.preventDefault(); };\n    this.onKey = e => {\n      const step = this.vlen * 0.03;\n      if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); this.advance(step * (e.key === ' ' ? 2.5 : 1)); }\n      else if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); this.advance(-step); }\n      else if (e.key === 'Home') this.pv = 0;\n      else if (e.key === 'End') this.pv = 1;\n    };\n    this.onMove = e => { this.mx = (e.clientX / window.innerWidth - 0.5) * 2; this.my = (e.clientY / window.innerHeight - 0.5) * 2; };\n    this.onResize = () => this.resize();\n    window.addEventListener('wheel', this.onWheel, { passive: false });\n    window.addEventListener('touchstart', this.onTouchStart, { passive: true });\n    window.addEventListener('touchmove', this.onTouchMove, { passive: false });\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('pointermove', this.onMove, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    this.waitForThree();\n  }\n\n  componentWillUnmount() {\n    ['wheel', 'touchstart', 'touchmove', 'keydown', 'pointermove', 'resize'].forEach((n, i) =>\n      window.removeEventListener(n, [this.onWheel, this.onTouchStart, this.onTouchMove, this.onKey, this.onMove, this.onResize][i]));\n    if (this.raf) cancelAnimationFrame(this.raf);\n    if (this.renderer) this.renderer.dispose();\n  }\n\n  componentDidUpdate() { this.applySlots(); }\n\n  applySlots() {\n    const root = this.rootRef.current; if (!root) return;\n    const venue = this.props.venue ?? 'Kanad Bhawan, Faculty of Technology, University of Delhi';\n    const date = this.props.eventDate ?? 'DATES TO BE ANNOUNCED';\n    root.querySelectorAll('[data-slot=\"venue\"]').forEach(n => { n.textContent = venue; });\n    root.querySelectorAll('[data-slot=\"date\"]').forEach(n => { n.textContent = date; });\n    const cta = root.querySelector('[data-el=\"cta\"]');\n    if (cta && this.props.unstopUrl) cta.href = this.props.unstopUrl;\n  }\n\n  // three logo treatments, all built from the same glyph row + robot marks\n  applyLogo(kind) {\n    const root = this.rootRef.current; if (!root) return;\n    this.logoKind = kind;\n    root.querySelectorAll('[data-opt]').forEach(el => {\n      el.style.display = el.dataset.opt === kind ? 'flex' : 'none';\n    });\n    const sub = root.querySelector('[data-el=\"logosub\"]');\n    if (sub) sub.style.display = ['D', 'E', 'F', 'A3'].includes(kind) ? 'none' : 'flex';\n    this.collectLogoParts();\n  }\n\n  collectLogoParts() {\n    const root = this.rootRef.current;\n    const active = root.querySelector('[data-opt=\"' + (this.logoKind || 'A3') + '\"]');\n    if (!active) return;\n    this.glyphs = Array.from(active.querySelectorAll('[data-glyph]'));\n    this.oDisc = active.querySelector('[data-el=\"odisc\"]');\n    this.botL = active.querySelector('[data-bot=\"L\"]');\n    this.botR = active.querySelector('[data-bot=\"R\"]');\n    this.clash = active.querySelector('[data-el=\"clashmark\"]');\n    this.slash = active.querySelector('[data-el=\"slash\"]');\n  }\n\n  collect() {\n    const root = this.rootRef.current;\n    this.hud = Array.from(root.querySelectorAll('[data-in]')).map(el => ({\n      el, in: parseFloat(el.dataset.in), out: parseFloat(el.dataset.out), side: el.dataset.side || 'c'\n    }));\n    this.dims = root.querySelector('[data-layer=\"dims\"]');\n    this.dimG = {\n      len: this.dims.querySelector('[data-dim=\"len\"]'),\n      hgt: this.dims.querySelector('[data-dim=\"hgt\"]'),\n      wep: this.dims.querySelector('[data-dim=\"wep\"]')\n    };\n    this.flashEl = root.querySelector('[data-layer=\"flash\"]');\n    this.shockEl = root.querySelector('[data-layer=\"shock\"]');\n    this.bloomEl = root.querySelector('[data-layer=\"bloom\"]');\n    this.logoEl = root.querySelector('[data-el=\"logo\"]');\n    this.collectLogoParts();\n    this.badge = root.querySelector('[data-el=\"cornerbadge\"]');\n    this.orgmarks = root.querySelector('[data-el=\"orgmarks\"]');\n    this.regEl = root.querySelector('[data-el=\"reg\"]');\n    this.regSlash = root.querySelector('[data-el=\"regslash\"]');\n    this.bar = root.querySelector('[data-slot=\"bar\"]');\n    this.stageTag = root.querySelector('[data-el=\"stagetag\"]');\n    this.scrollCue = root.querySelector('[data-el=\"scrollcue\"]');\n    this.subrules = Array.from(root.querySelectorAll('[data-el=\"subrule\"]'));\n  }\n\n  waitForThree() {\n    if (window.THREE) { this.initScene(); this.loop(); return; }\n    this.tries = (this.tries || 0) + 1;\n    if (this.tries > 240) return;\n    setTimeout(() => this.waitForThree(), 60);\n  }\n\n  initScene() {\n    const T = window.THREE;\n    this.renderer = new T.WebGLRenderer({ canvas: this.canvasRef.current, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });\n    this.renderer.setClearColor(0x04060a, 1);\n    this.renderer.outputEncoding = T.sRGBEncoding;\n    this.renderer.toneMapping = T.ACESFilmicToneMapping;\n    this.renderer.toneMappingExposure = 0.86;\n    this.renderer.shadowMap.enabled = true;\n    this.renderer.shadowMap.type = T.PCFSoftShadowMap;\n\n    this.scene = new T.Scene();\n    this.scene.fog = new T.FogExp2(0x04060a, 0.05);\n    this.camera = new T.PerspectiveCamera(34, 16 / 9, 0.05, 260);\n\n    const cold = new T.Color(this.props.accentCold ?? '#2f7dff');\n    const hot = new T.Color(this.props.accentHot ?? '#ff2f3d');\n    this.cold = cold; this.hot = hot;\n    this.scene.environment = this.makeEnv();\n\n    this.scene.add(new T.HemisphereLight(0x28414f, 0x06090c, 0.22));\n    const key = new T.DirectionalLight(0xeaf6ff, 0.85);\n    key.position.set(-7, 11, -4); key.castShadow = true;\n    key.shadow.mapSize.set(2048, 2048);\n    const cs = key.shadow.camera; cs.left = -10; cs.right = 10; cs.top = 10; cs.bottom = -10; cs.near = 1; cs.far = 48;\n    key.shadow.bias = -0.0008;\n    this.scene.add(key);\n    const blueRig = new T.PointLight(cold, 3.4, 17, 2); blueRig.position.set(1.2, 4.2, -3); this.scene.add(blueRig);\n    const redRig = new T.PointLight(hot, 3.4, 17, 2); redRig.position.set(8.8, 4.2, 3); this.scene.add(redRig);\n    const overhead = new T.PointLight(0xd6e9f7, 2.6, 16, 2); overhead.position.set(CX, 6.0, 0); this.scene.add(overhead);\n    this.rigs = [blueRig, redRig, overhead];\n\n    this.buildArena(cold, hot);\n\n    this.bot1 = this.buildRobot(R1, cold, 'vertical');\n    this.bot1.position.set(1.4, 0.062, 0); this.bot1.rotation.y = Math.PI / 2;\n    this.scene.add(this.bot1);\n    this.bot2 = this.buildRobot(R2, hot, 'drum');\n    this.bot2.position.set(8.6, 0.062, 0); this.bot2.rotation.y = -Math.PI / 2;\n    this.scene.add(this.bot2);\n\n    const DECK = 0.062;   // top face of the floor panels\n    [this.bot1, this.bot2].forEach(b => {\n      // wheel bottoms sit at local y = 0 by construction; tread ridges add a hair\n      b.position.y = DECK + b.userData.D.wheel * 0.03;\n      b.userData.deckY = b.position.y;\n    });\n\n    this.sparks = this.buildSparks();\n    this.scene.add(this.sparks.points);\n    this.debris = this.buildDebris();\n    this.scene.add(this.debris.points);\n\n    this.shockMesh = new T.Mesh(\n      new T.RingGeometry(0.2, 0.34, 64),\n      new T.MeshBasicMaterial({ color: 0xffd7a0, transparent: true, opacity: 0, side: T.DoubleSide, blending: T.AdditiveBlending, depthWrite: false })\n    );\n    this.shockMesh.rotation.x = -Math.PI / 2;\n    this.shockMesh.position.set(CX, 0.06, 0);\n    this.scene.add(this.shockMesh);\n\n    this.impactLight = new T.PointLight(0xfff0d0, 0, 16, 2);\n    this.impactLight.position.set(CX, 0.5, 0);\n    this.scene.add(this.impactLight);\n\n    // smooth camera rails\n    this.posCurve = new T.CatmullRomCurve3(CAM.map(k => new T.Vector3(...k.pos)), false, 'catmullrom', 0.4);\n    this.tgtCurve = new T.CatmullRomCurve3(CAM.map(k => new T.Vector3(...k.tgt)), false, 'catmullrom', 0.4);\n\n    this.resize();\n    window.CRYONIX = this;\n  }\n\n  makeEnv() {\n    const T = window.THREE;\n    const c = document.createElement('canvas'); c.width = 64; c.height = 64;\n    const g = c.getContext('2d');\n    const grd = g.createLinearGradient(0, 0, 0, 64);\n    grd.addColorStop(0, '#1c2b36'); grd.addColorStop(0.45, '#0b1116'); grd.addColorStop(1, '#04070a');\n    g.fillStyle = grd; g.fillRect(0, 0, 64, 64);\n    g.fillStyle = 'rgba(215,238,250,0.6)'; g.fillRect(0, 0, 64, 6);\n    g.fillStyle = 'rgba(80,150,255,0.18)'; g.fillRect(0, 20, 64, 6);\n    g.fillStyle = 'rgba(255,70,80,0.14)'; g.fillRect(0, 34, 64, 5);\n    const tex = new T.CanvasTexture(c);\n    tex.mapping = T.EquirectangularReflectionMapping;\n    tex.encoding = T.sRGBEncoding;\n    return tex;\n  }\n\n  // enclosure modelled on the reference: black extrusion frame, clear panels, truss skirt, panelled floor\n  buildArena(cold, hot) {\n    const T = window.THREE;\n    const H = ARENA_H, A = ARENA, h = A / 2;\n    const extrusion = new T.MeshStandardMaterial({ color: 0x14181c, metalness: 0.72, roughness: 0.42 });\n    const deckMat = new T.MeshStandardMaterial({ color: 0x171d23, metalness: 0.3, roughness: 0.78 });\n    const seam = new T.MeshStandardMaterial({ color: 0x0c1013, metalness: 0.5, roughness: 0.7 });\n\n    const g = new T.Group(); g.position.set(CX, 0, 0) false };\n  }\n\n  seedImpact(o) {\n    const s = this.sparks;\n    for (let i = 0; i < s.N; i++) {\n      const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI * 0.62;\n      const sp = 1.2 + Math.random() * 3.6;\n      s.pos[i * 6] = o.x; s.pos[i * 6 + 1] = o.y; s.pos[i * 6 + 2] = o.z;\n      s.pos[i * 6 + 3] = o.x; s.pos[i * 6 + 4] = o.y; s.pos[i * 6 + 5] = o.z;\n      s.vel[i * 3] = Math.cos(th) * Math.sin(ph) * sp;\n      s.vel[i * 3 + 1] = Math.abs(Math.cos(ph)) * sp * 1.25;\n      s.vel[i * 3 + 2] = Math.sin(th) * Math.sin(ph) * sp;\n      s.life[i] = 0.3 + Math.random() * 0.95;\n    }\n    s.seeded = true;\n    const d = this.debris;\n    for (let i = 0; i < d.N; i++) {\n      const th = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.4;\n      for (let k = 0; k < 6; k++) d.pos[i * 6 + k] = k % 3 === 0 ? o.x : k % 3 === 1 ? o.y : o.z;\n      d.vel[i * 3] = Math.cos(th) * sp; d.vel[i * 3 + 1] = 1.3 + Math.random() * 2.8; d.vel[i * 3 + 2] = Math.sin(th) * sp;\n      d.life[i] = 0.6 + Math.random() * 1.1;\n    }\n    d.seeded = true;\n  }\n\n  resize() {\n    if (!this.renderer) return;\n    const w = window.innerWidth, h = window.innerHeight;\n    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));\n    this.renderer.setSize(w, h, false);\n    this.camera.aspect = w / h; this.camera.updateProjectionMatrix();\n    this.dims.setAttribute('viewBox', '0 0 ' + w + ' ' + h);\n    this.vw = w; this.vh = h;\n  }\n\n  frame(now, dt, snap) {\n    // heavier smoothing = the camera never snaps to the wheel\n    this.p += (this.pv - this.p) * Math.min(1, dt * 2.4);\n    if (snap) this.p = this.pv;\n    this.pSmooth = this.p;\n    this.mxs += (this.mx - this.mxs) * Math.min(1, dt * 3);\n    this.mys += (this.my - this.mys) * Math.min(1, dt * 3);\n    const p = this.p;\n    this.updateRobots(p, now, dt);\n    this.updateCamera(p, now);\n    this.updateWorld(p, now);\n    this.updateHud(p, now);\n    this.updateDims(p);\n    this.updateFx(p, dt);\n    this.renderer.render(this.scene, this.camera);\n  }\n\n  loop = () => {\n    this.raf = requestAnimationFrame(this.loop);\n    const now = performance.now() / 1000;\n    const dt = Math.min(0.05, now - (this.last || now)); this.last = now;\n    this.frame(now, dt, false);\n  };\n\n  updateCamera(p, now) {\n    const T = window.THREE;\n    let i = 0;\n    while (i < CAM.length - 2 && p > CAM[i + 1].p) i++;\n    const a = CAM[i], b = CAM[i + 1];\n    const segT = ease(inv(p, a.p, b.p));\n    const u = (i + segT) / (CAM.length - 1);\n    const pos = this.posCurve.getPoint(u);\n    const tgt = this.tgtCurve.getPoint(u);\n\n    const life = 0.012 + 0.016 * inv(p, 0.36, 0.6);\n    const park = (1 - inv(p, 0.015, 0.08)) * 0.24;\n    const kick = Math.pow(1 - inv(p, IMPACT, IMPACT + 0.05), 2) * inv(p, IMPACT - 0.004, IMPACT) * 0.3;\n    const sh = () => (Math.random() - 0.5) * kick;\n\n    this.camera.position.set(\n      pos.x + Math.sin(now * 0.68) * life + this.mxs * park + sh(),\n      pos.y + Math.cos(now * 0.51) * life * 0.75 - this.mys * park * 0.55 + sh(),\n      pos.z + Math.sin(now * 0.39) * life * 0.6 + sh()\n    );\n    this.camera.fov = lerp(a.fov, b.fov, segT);\n    this.camera.updateProjectionMatrix();\n    this.camera.lookAt(tgt);\n  }\n\n  updateRobots(p, now, dt) {\n    const adv = smooth(inv(p, 0.372, 0.436));\n    const hold = inv(p, 0.436, 0.668);\n    const charge = ease(inv(p, 0.668, IMPACT));\n    const post = inv(p, IMPACT, 1);\n    const c1x = CX - 0.90, c2x = CX + 1.30;\n\n    const creep = 0.4 * smooth(inv(p, 0.436, 0.470)) + 0.6 * smooth(inv(p, 0.560, 0.600));\n    const x1 = lerp(1.4, 3.0, adv) + creep * 0.5;\n    const x2 = lerp(8.6, 7.1, adv) - creep * 0.5;\n    const lock = smooth(inv(p, 0.470, 0.500)) * (1 - smooth(inv(p, 0.545, 0.575)));\n    const feint = Math.sin(hold * Math.PI * 3.4) * 0.2 * (1 - hold * 0.45) * (1 - lock);\n\n    // after the hit both machines are shoved back, then recover\n    const knock = post > 0 ? Math.sin(post * 9) * Math.exp(-post * 7) * 0.9 : 0;\n    const b1 = lerp(x1 + feint, c1x, charge) - knock;\n    const b2 = lerp(x2 - feint, c2x, charge) + knock * 1.25;\n\n    const set = (bot, x, dir, spin, phase) => {\n      const D = bot.userData.D;\n      const jit = (0.005 + 0.015 * (adv * (1 - charge) + charge)) * (1 - post * 0.5);\n      bot.position.x = x + (Math.random() - 0.5) * jit;\n      bot.position.z = Math.sin(now * 1.6 + phase) * jit * 0.7;\n      const aim = Math.sin(now * 0.85 + phase) * 0.05 * hold * (1 - charge) * (1 - lock);\n      const spinout = post > 0 ? Math.sin(post * 7 + phase) * Math.exp(-post * 5) * 0.55 : 0;\n      bot.rotation.y = dir * Math.PI / 2 + aim + spinout;\n      const accel = adv * (1 - charge) * 0.6 + charge;\n      const hit = Math.exp(-Math.max(0, p - IMPACT) * 26) * (p > IMPACT - 0.002 ? 1 : 0);\n      const body = bot.userData.body;\n      const squat = 0.022 * accel;\n      body.rotation.x = -squat + hit * 0.17 + Math.sin(now * 6 + phase) * 0.008 * accel;\n      bot.userData.noseLift = Math.sin(squat) * D.L * 0.55;\n      body.rotation.z = hit * Math.sin(post * 12) * 0.16;\n      body.position.y = bot.userData.noseLift + hit * 0.17;\n      bot.position.y = bot.userData.deckY ?? 0.062;\n      const roll = (x - (bot.userData.lastX ?? x)) / D.wheel;\n      bot.userData.wheels.forEach(w => { w.rotation.x += roll * dir * 3.4 + (adv + charge) * 0.03; });\n      bot.userData.lastX = x;\n      const rpm = spin * (0.1 + 0.5 * inv(p, 0.36, 0.5) + 1.0 * inv(p, 0.58, 0.70));\n      const damp = p > IMPACT ? Math.max(0.2, 1 - (p - IMPACT) * 7) : 1;\n      bot.userData.wep.rotation.x += rpm * dt * damp;\n    };\n    set(this.bot1, b1, 1, 50, 0);\n    set(this.bot2, b2, -1, 40, 2.1);\n  }\n\n  updateWorld(p, now) {\n    const reveal = smooth(inv(p, 0.028, 0.085));\n    this.scene.fog.density = lerp(0.42, 0.015, reveal);\n    this.grid.material.opacity = 0.5 * reveal;\n    this.frameLines.material.opacity = 0.45 * reveal;\n    if (p > 0.83) this.scene.fog.density = lerp(0.017, 0.05, inv(p, 0.83, 1));\n    // rigs pulse harder as the fight builds, then flare on the hit\n    const heat = inv(p, 0.56, IMPACT);\n    const flare = Math.pow(1 - inv(p, IMPACT, IMPACT + 0.05), 2) * inv(p, IMPACT - 0.004, IMPACT);\n    this.rigs[0].intensity = 3.4 + heat * 2.2 + Math.sin(now * 7) * heat * 0.9;\n    this.rigs[1].intensity = 3.4 + heat * 2.2 + Math.cos(now * 6.3) * heat * 0.9;\n    this.impactLight.intensity = 20 * flare;\n  }\n\n  worldToScreen(v) {\n    const c = v.clone().project(this.camera);\n    return { x: (c.x * 0.5 + 0.5) * this.vw, y: (-c.y * 0.5 + 0.5) * this.vh };\n  }\n\n  setDim(g, aW, bW, label, t, mode) {\n    const A = this.worldToScreen(aW), B = this.worldToScreen(bW);\n    const line = g.querySelector('[data-dl=\"1\"]');\n    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;\n    line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);\n    line.setAttribute('x2', A.x + dx * t); line.setAttribute('y2', A.y + dy * t);\n    const nx = -dy / len * 7, ny = dx / len * 7;\n    const ta = g.querySelector('[data-tick=\"a\"]'), tb = g.querySelector('[data-tick=\"b\"]');\n    if (ta) { ta.setAttribute('x1', A.x - nx); ta.setAttribute('y1', A.y - ny); ta.setAttribute('x2', A.x + nx); ta.setAttribute('y2', A.y + ny); ta.setAttribute('opacity', t > 0.05 ? 1 : 0); }\n    if (tb) { tb.setAttribute('x1', B.x - nx); tb.setAttribute('y1', B.y - ny); tb.setAttribute('x2', B.x + nx); tb.setAttribute('y2', B.y + ny); tb.setAttribute('opacity', t > 0.96 ? 1 : 0); }\n    const txt = g.querySelector('[data-dt=\"1\"]');\n    txt.textContent = label;\n    if (mode === 'lead') { txt.setAttribute('x', B.x + 10); txt.setAttribute('y', B.y + 4); txt.setAttribute('text-anchor', 'start'); }\n    else if (mode === 'v') { txt.setAttribute('x', A.x + dx / 2 + 14); txt.setAttribute('y', A.y + dy / 2 + 5); txt.setAttribute('text-anchor', 'start'); }\n    else { txt.setAttribute('x', A.x + dx / 2); txt.setAttribute('y', A.y + dy / 2 + 24); txt.setAttribute('text-anchor', 'middle'); }\n    txt.setAttribute('opacity', clamp((t - 0.5) / 0.35, 0, 1));\n  }\n\n  updateDims(p) {\n    const T = window.THREE;\n    const a = inv(p, 0.276, 0.284) * (1 - inv(p, 0.340, 0.352));\n    const b = inv(p, 0.492, 0.500) * (1 - inv(p, 0.548, 0.560));\n    const act = a > 0 ? { o: a, bot: this.bot1, D: R1, wep: '8 KG CLASS', s: 0.276 }\n      : b > 0 ? { o: b, bot: this.bot2, D: R2, wep: '12 KG CLASS', s: 0.492 } : null;\n    if (!act) { this.dims.style.opacity = 0; return; }\n    this.dims.style.opacity = act.o;\n    const D = act.D, bot = act.bot;\n    const mm = v => Math.round(v * 250) + ' MM';\n    const ox = bot.position.x, nz = -(D.W / 2 + 0.18);\n    const t1 = ease(inv(p, act.s + 0.004, act.s + 0.024));\n    const t2 = ease(inv(p, act.s + 0.020, act.s + 0.042));\n    const t3 = ease(inv(p, act.s + 0.038, act.s + 0.058));\n    this.setDim(this.dimG.len, new T.Vector3(ox - D.L / 2, 0.07, nz), new T.Vector3(ox + D.L / 2, 0.07, nz), mm(D.L), t1, 'h');\n    this.setDim(this.dimG.hgt, new T.Vector3(ox + D.L / 2 + 0.2, 0.07, nz), new T.Vector3(ox + D.L / 2 + 0.2, D.H + 0.13, nz), mm(D.H), t2, 'v');\n    const wp = bot.userData.wep.getWorldPosition(new T.Vector3());\n    const lead = bot === this.bot1 ? -1.05 : 1.35;\n    this.setDim(this.dimG.wep, wp, new T.Vector3(wp.x + lead, wp.y + 0.85, wp.z - 0.1), act.wep, t3, 'lead');\n    const gt = this.dimG.wep.querySelector('[data-dt=\"1\"]');\n    if (lead < 0) { gt.setAttribute('text-anchor', 'end'); gt.setAttribute('x', +gt.getAttribute('x') - 20); }\n    [this.dimG.len, this.dimG.hgt, this.dimG.wep].forEach((g, i) => g.setAttribute('opacity', [t1, t2, t3][i] > 0 ? 1 : 0));\n  }\n\n  updateFx(p, dt) {\n    const s = this.sparks, d = this.debris;\n    const live = p > IMPACT - 0.002 && p < 0.9;\n    if (live) {\n      if (!s.seeded) this.seedImpact(new window.THREE.Vector3(CX, 0.5, 0));\n      for (let i = 0; i < s.N; i++) {\n        if (s.life[i] <= 0) continue;\n        s.life[i] -= dt * 0.85;\n        s.vel[i * 3 + 1] -= 8.5 * dt;\n        const hx = s.pos[i * 6 + 3], hy = s.pos[i * 6 + 4], hz = s.pos[i * 6 + 5];\n        const nx2 = hx + s.vel[i * 3] * dt, ny2 = hy + s.vel[i * 3 + 1] * dt, nz2 = hz + s.vel[i * 3 + 2] * dt;\n        s.pos[i * 6] = hx; s.pos[i * 6 + 1] = hy; s.pos[i * 6 + 2] = hz;\n        s.pos[i * 6 + 3] = nx2; s.pos[i * 6 + 4] = Math.max(0.02, ny2); s.pos[i * 6 + 5] = nz2;\n        if (ny2 < 0.02) s.vel[i * 3 + 1] *= -0.3;\n      }\n      s.points.geometry.attributes.position.needsUpdate = true;\n      s.mat.opacity = clamp(1 - inv(p, 0.78, 0.88), 0, 1);\n\n      for (let i = 0; i < d.N; i++) {\n        if (d.life[i] <= 0) continue;\n        d.life[i] -= dt * 0.7;\n        d.vel[i * 3 + 1] -= 7 * dt;\n        const hx = d.pos[i * 6 + 3], hy = d.pos[i * 6 + 4], hz = d.pos[i * 6 + 5];\n        let nx = hx + d.vel[i * 3] * dt, ny = hy + d.vel[i * 3 + 1] * dt, nz = hz + d.vel[i * 3 + 2] * dt;\n        if (ny < 0.07) { ny = 0.07; d.vel[i * 3 + 1] *= -0.28; d.vel[i * 3] *= 0.72; d.vel[i * 3 + 2] *= 0.72; }\n        d.pos[i * 6] = hx; d.pos[i * 6 + 1] = hy; d.pos[i * 6 + 2] = hz;\n        d.pos[i * 6 + 3] = nx; d.pos[i * 6 + 4] = ny; d.pos[i * 6 + 5] = nz;\n      }\n      d.points.geometry.attributes.position.needsUpdate = true;\n      d.mat.opacity = 0.62 * clamp(1 - inv(p, 0.76, 0.9), 0, 1);\n    } else {\n      s.mat.opacity = 0; d.mat.opacity = 0;\n      if (p < IMPACT - 0.01) { s.seeded = false; d.seeded = false; }\n    }\n    // ground shockwave\n    const sw = inv(p, IMPACT, IMPACT + 0.07);\n    if (sw > 0 && sw < 1) {\n      const r = lerp(0.2, 5.5, sw);\n      this.shockMesh.scale.setScalar(r / 0.27);\n      this.shockMesh.material.opacity = 0.75 * Math.pow(1 - sw, 1.6);\n    } else this.shockMesh.material.opacity = 0;\n  }\n\n  updateHud(p, now) {\n    // logo: letters rise out of the floor line, disc spins down into place, robots slide in\n    if (this.t0 == null) this.t0 = now;\n    const a = smooth(clamp((now - this.t0) / 1.9, 0, 1));\n    const exit = smooth(inv(p, 0.020, 0.085));\n    this.glyphs.forEach((g, i) => {\n      const d = i * 0.07;\n      const t = smooth(clamp((a - d) / (1 - d || 1), 0, 1));\n      g.style.opacity = t;\n      g.style.transform = 'translateY(' + ((1 - t) * 58).toFixed(1) + 'px) rotateX(' + ((1 - t) * 62).toFixed(1) + 'deg) scale(' + lerp(0.94, 1, t).toFixed(3) + ')';\n      g.style.filter = t < 1 ? 'blur(' + ((1 - t) * 6).toFixed(2) + 'px)' : 'none';\n      g.style.transformOrigin = '50% 100%';\n    });\n    if (this.oDisc) {\n      const spinIn = clamp((a - 0.18) / 0.82, 0, 1);\n      this.oDisc.style.transform = 'rotate(' + (lerp(-540, 0, ease(spinIn)) + (1 - exit) * Math.sin(now * 0.6) * 3).toFixed(1) + 'deg)';\n      this.oDisc.style.opacity = spinIn;\n    }\n    const slide = ease(clamp((a - 0.3) / 0.7, 0, 1));\n    if (this.botL) { this.botL.style.transform = 'translateX(' + ((1 - slide) * -170).toFixed(1) + 'px)'; this.botL.style.opacity = slide; }\n    if (this.botR) { this.botR.style.transform = 'scaleX(-1) translateX(' + ((1 - slide) * -170).toFixed(1) + 'px)'; this.botR.style.opacity = slide; }\n    if (this.slash) {\n      const cut = ease(clamp((a - 0.55) / 0.45, 0, 1));\n      this.slash.style.transform = 'translateY(-50%) skewY(-7deg) scaleX(' + cut.toFixed(3) + ')';\n      this.slash.style.transformOrigin = '0% 50%';\n    }\n    if (this.clash) {\n      const pop = clamp((a - 0.72) / 0.28, 0, 1);\n      this.clash.style.opacity = pop;\n      this.clash.style.transform = 'scale(' + lerp(0.3, 1, ease(pop)).toFixed(3) + ') rotate(' + (now * 40).toFixed(1) + 'deg)';\n    }\n    this.subrules.forEach(r => { r.style.transform = 'scaleX(' + slide.toFixed(3) + ')'; });\n\n    const scale = lerp(1, 0.15, exit);\n    const dx = lerp(0, -this.vw * 0.5 + 118, exit);\n    const dy = lerp(0, -this.vh * 0.5 + 44, exit);\n    this.logoEl.style.opacity = 1 - exit;\n    this.logoEl.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + scale.toFixed(3) + ') translate(' + (this.mxs * -12).toFixed(1) + 'px,' + (this.mys * -7).toFixed(1) + 'px)';\n    if (this.scrollCue) this.scrollCue.style.opacity = (1 - smooth(inv(p, 0.002, 0.02))) * a;\n\n    const showPicker = false;\n    if (!!this.state.picker !== showPicker) this.setState({ picker: showPicker });\n\n    this.badge.style.opacity = smooth(inv(p, 0.07, 0.11)) * (1 - inv(p, 0.83, 0.865));\n    this.orgmarks.style.opacity = lerp(0.6, 0.95, smooth(inv(p, 0.02, 0.08))) * (1 - inv(p, 0.83, 0.865));\n    this.stageTag.style.opacity = smooth(inv(p, 0.08, 0.13)) * (1 - inv(p, 0.80, 0.86)) * 0.85;\n\n    for (const n of this.hud) {\n      const o = smooth(inv(p, n.in, n.in + 0.014)) * (1 - smooth(inv(p, n.out - 0.014, n.out)));\n      n.el.style.opacity = o;\n      const off = (1 - smooth(inv(p, n.in, n.in + 0.03))) * 22;\n      const sx = n.side === 'r' ? off : n.side === 'l' ? -off : 0;\n      const base = n.side === 'c' ? 'translateX(-50%)' : 'translateY(-50%)';\n      n.el.style.transform = base + ' translate3d(' + sx.toFixed(1) + 'px,' + (n.side === 'c' ? -off : 0).toFixed(1) + 'px,0)';\n    }\n\n    const T = window.THREE;\n    const cp = this.worldToScreen(new T.Vector3(CX, 0.5, 0));\n    const fl = Math.pow(1 - inv(p, IMPACT + 0.001, IMPACT + 0.042), 1.5) * inv(p, IMPACT - 0.003, IMPACT + 0.001);\n    this.flashEl.style.opacity = clamp(fl * 0.8, 0, 1);\n    this.flashEl.style.transform = 'translate(' + cp.x.toFixed(1) + 'px,' + cp.y.toFixed(1) + 'px) scale(' + lerp(0.06, 1.5, inv(p, IMPACT, IMPACT + 0.05)).toFixed(3) + ')';\n    const sw = inv(p, IMPACT, IMPACT + 0.055);\n    this.shockEl.style.opacity = sw > 0 && sw < 1 ? (0.85 * Math.pow(1 - sw, 1.4)).toFixed(3) : 0;\n    this.shockEl.style.transform = 'translate(' + cp.x.toFixed(1) + 'px,' + cp.y.toFixed(1) + 'px) scale(' + lerp(0.08, 2.4, sw).toFixed(3) + ')';\n    this.bloomEl.style.opacity = (Math.pow(1 - inv(p, IMPACT, IMPACT + 0.016), 2) * inv(p, IMPACT - 0.003, IMPACT + 0.001) * 0.4).toFixed(3);\n\n    const reg = smooth(inv(p, 0.845, 0.905));\n    this.regEl.style.opacity = reg;\n    this.regEl.style.pointerEvents = reg > 0.6 ? 'auto' : 'none';\n    this.regEl.style.transform = 'translateY(' + ((1 - reg) * 28).toFixed(1) + 'px)';\n    if (this.regSlash) {\n      const cut = ease(clamp((reg - 0.35) / 0.5, 0, 1));\n      this.regSlash.style.transform = 'translateY(-50%) skewY(-6deg) scaleX(' + cut.toFixed(3) + ')';\n      this.regSlash.style.transformOrigin = '0% 50%';\n    }\n\n    const stages = ['01 LOGO', '02 ARENA', '03 BLUE CORNER', '04 EVENT', '05 CATEGORY 8 KG', '06 SPECIFICATION', '07 ARENA WIDE', '08 RED CORNER', '09 CATEGORY 12 KG', '10 ENGAGE', '11 IMPACT', '12 REGISTER'];\n    const marks = [0, 0.045, 0.13, 0.17, 0.262, 0.276, 0.372, 0.47, 0.492, 0.6, IMPACT, 0.845];\n    let label = stages[0];\n    marks.forEach((m, i) => { if (p >= m) label = stages[i]; });\n    if (this.stageTag.textContent !== label) this.stageTag.textContent = label;\n    this.bar.style.width = (p * 100).toFixed(2) + '%';\n    this.rootRef.current.setAttribute('data-screen-label', label);\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
